<!DOCTYPE html><html class="h-full" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>KrishiVani - Language Selection</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

          darkMode: "class",
          theme: {
            extend: {

                      "secondary": "#286b33",
                      "outline": "#717a6d",
                      "on-surface-variant": "#41493e",
                      "on-tertiary-fixed-variant": "#005312",
                      "on-primary-fixed-variant": "#0c5216",
                      "inverse-primary": "#91d78a",
                      "on-primary": "#ffffff",
                      "on-background": "#191c1b",
                      "error": "#ba1a1a",
                      "on-secondary-fixed": "#002107",
                      "on-secondary": "#ffffff",
                      "on-primary-container": "#90d689",
                      "secondary-fixed-dim": "#90d792",
                      "on-secondary-container": "#2e7238",
                      "on-primary-fixed": "#002203",
                      "surface-dim": "#d8dad9",
                      "on-error": "#ffffff",
                      "outline-variant": "#c0c9bb",
                      "surface-container": "#eceeec",
                      "on-tertiary-container": "#86d881",
                      "on-tertiary": "#ffffff",
                      "tertiary-fixed-dim": "#88d982",
                      "surface-container-low": "#f2f4f2",
                      "surface-container-highest": "#e1e3e1",
                      "surface-container-high": "#e6e9e7",
                      "tertiary-fixed": "#a3f69c",
                      "error-container": "#ffdad6",
                      "primary-fixed-dim": "#91d78a",
                      "tertiary-container": "#055f18",
                      "on-error-container": "#93000a",
                      "on-tertiary-fixed": "#002204",
                      "secondary-container": "#abf4ac",
                      "on-surface": "#191c1b",
                      "surface": "#f8faf8",
                      "primary": "#00450d",
                      "secondary-fixed": "#abf4ac",
                      "inverse-surface": "#2e3130",
                      "surface-bright": "#f8faf8"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "base": "8px",
                      "gutter": "16px",
                      "card-padding": "20px",
                      "margin-desktop": "32px",
                      "margin-mobile": "16px",
                      "touch-target-min": "48px"
              },
              "fontFamily": {
                      "headline-md": [
                              "Inter"
                      ],
                      "label-lg": [
                              "Inter"
                      ],
                      "body-md": [
                              "Inter"
                      ],
                      "headline-lg": [
                              "Inter"
                      ],
                      "button-text": [
                              "Inter"
                      ],
                      "body-lg": [

                      "headline-lg-mobile": [

                      ]
              },
              "fontSize": {

                              "24px",

                      "body-md": [

                      "headline-lg": [

                                      "fontWeight": "600"

                      ],
                      "body-lg": [
                              "18px",

                                      "lineHeight": "28px",
                                      "fontWeight": "400"

                      "headline-lg-mobile": [

                              {
                                      "lineHeight": "32px",
                                      "fontWeight": "700"

                      ]
              }

          },
        }

</head>
<body class="bg-background h-full flex flex-col font-body-md text-on-surface">
<!-- Top Navigation (Contextual, No Global Nav Shells as this is a specific settings/onboarding flow) -->
<header class="flex items-center w-full px-margin-mobile h-touch-target-min z-50 bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline">
<button aria-label="Go back" class="p-2 -ml-2 rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>

</header>
<main class="flex-1 overflow-y-auto px-margin-mobile py-8 pb-32">
<div class="max-w-md mx-auto">
<!-- Header Content -->
<div class="mb-8">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary-container mb-2">Choose Your Language</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Select the language you are most comfortable with.</p>
</div>
<!-- Language Options -->
<div class="flex flex-col gap-4">
<!-- English (Selected State) -->
<button aria-pressed="true" class="w-full text-left bg-surface-container-lowest rounded-xl p-card-padding min-h-touch-target-min border-2 border-primary-container shadow-sm flex items-center justify-between transition-all">
<div>
<span class="block font-body-lg text-body-lg font-semibold text-primary-container">English</span>
<span class="block font-label-lg text-label-lg text-on-surface-variant mt-1">English</span>
</div>
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Hindi (Unselected State) -->
<button aria-pressed="false" class="w-full text-left bg-surface-container-lowest rounded-xl p-card-padding min-h-touch-target-min border border-outline-variant hover:border-primary-container/50 hover:bg-surface-container-low shadow-sm flex items-center justify-between transition-all group">
<div>
<span class="block font-body-lg text-body-lg font-semibold text-on-surface group-hover:text-primary-container">हिंदी</span>
<span class="block font-label-lg text-label-lg text-on-surface-variant mt-1">Hindi</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary-container/50">radio_button_unchecked</span>
</button>
<!-- Bengali (Unselected State) -->
<button aria-pressed="false" class="w-full text-left bg-surface-container-lowest rounded-xl p-card-padding min-h-touch-target-min border border-outline-variant hover:border-primary-container/50 hover:bg-surface-container-low shadow-sm flex items-center justify-between transition-all group">
<div>
<span class="block font-body-lg text-body-lg font-semibold text-on-surface group-hover:text-primary-container">বাংলা</span>
<span class="block font-label-lg text-label-lg text-on-surface-variant mt-1">Bengali</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary-container/50">radio_button_unchecked</span>
</button>
<!-- Punjabi (Unselected State) -->
<button aria-pressed="false" class="w-full text-left bg-surface-container-lowest rounded-xl p-card-padding min-h-touch-target-min border border-outline-variant hover:border-primary-container/50 hover:bg-surface-container-low shadow-sm flex items-center justify-between transition-all group">
<div>
<span class="block font-body-lg text-body-lg font-semibold text-on-surface group-hover:text-primary-container">ਪੰਜਾਬੀ</span>
<span class="block font-label-lg text-label-lg text-on-surface-variant mt-1">Punjabi</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary-container/50">radio_button_unchecked</span>
</button>
</div>
</div>
</main>
<!-- Primary Action (Fixed Bottom) -->
<div class="fixed bottom-0 left-0 w-full bg-background/90 backdrop-blur-sm border-t border-outline-variant/30 p-margin-mobile z-40 shadow-[0_-4px_12px_0_rgba(0,0,0,0.02)]">
<div class="max-w-md mx-auto">
<button class="w-full bg-primary-container text-on-primary font-button-text text-button-text h-touch-target-min rounded-xl flex items-center justify-center hover:bg-primary-container/90 active:scale-[0.98] transition-all shadow-sm">
                Continue
            </button>
</div>
</div>


</body></html>
