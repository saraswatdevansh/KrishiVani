<style>
        .pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(27, 94, 32, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(27, 94, 32, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(27, 94, 32, 0); }
        }
        .ripple {
            position: relative;
            overflow: hidden;
        }
        .ripple::after {
            content: "";
            display: block;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            background-image: radial-gradient(circle, #fff 10%, transparent 10.01%);
            background-repeat: no-repeat;
            background-position: 50%;
            transform: scale(10, 10);
            opacity: 0;
            transition: transform .5s, opacity 1s;
        }
        .ripple:active::after {
            transform: scale(0, 0);
            opacity: .3;
            transition: 0s;
        }
    </style>
</head>

<!-- Main Content Area -->

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const micBtn = document.getElementById('micBtn');
            const micStatus = document.getElementById('micStatus');
            const responseCard = document.getElementById('responseCard');

            micBtn.addEventListener('click', () => {
                // Listening State
                micBtn.classList.remove('bg-primary-container', 'text-on-primary-container');
                micBtn.classList.add('bg-error', 'text-on-error');
                micStatus.textContent = 'Listening...';
                responseCard.classList.add('hidden', 'opacity-0', 'translate-y-4');

                // Mock API delay
                setTimeout(() => {
                    // Reset Mic
                    micBtn.classList.remove('bg-error', 'text-on-error');
                    micBtn.classList.add('bg-primary-container', 'text-on-primary-container');
                    micStatus.textContent = 'Tap to Speak';

                    // Show Response
                    responseCard.classList.remove('hidden');
                    // Small delay to allow display:block to apply before animating opacity
                    setTimeout(() => {
                        responseCard.classList.remove('opacity-0', 'translate-y-4');
                        responseCard.classList.add('opacity-100', 'translate-y-0');
                    }, 50);
                }, 2000);
            });
        });
    </script>
